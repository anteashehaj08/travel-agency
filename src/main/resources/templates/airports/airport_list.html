<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Airports</title>
</head>
<body>
<h2>Airport List</h2>
<div sec:authorize="hasRole('admin')">
<a th:href="@{/airport.create}">Create New Airport</a>
<table>
  <thead>
  <tr>
  <th>ID</th>
  <th>Name</th>
  <th>City</th>
  </tr>
  </thead>
  <tr th:each="airport : ${airports}">
    <td th:text="${airports.airportId}"></td>
    <td th:text="${airports.name}"></td>
    <td th:text="${airports.city}"></td>
  </tr>
</table>
</div>
</body>
</html>
