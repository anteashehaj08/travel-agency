<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Countries</title>
</head>
<body>
<div sec:authorize="hasRole('ADMIN')">
    <h2>Countries</h2>
    <table>
        <tr>ID</tr>
        <th>Name</th>
        </tr>
        <tr th:each="country : ${country}">
            <td th:text="${country.id}"></td>
            <td th:text="${country.name}"></td>
        </tr>
    </table>
</div>
</body>
</html>
