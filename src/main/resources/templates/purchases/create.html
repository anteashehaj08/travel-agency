<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create New Purchase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow">
                <div class="card-header bg-success text-white text-center">
                    <h4>Book a Tour</h4>
                </div>

                <div class="card-body">
                    <form th:action="@{/purchases}" th:object="${purchaseRequestDto}" method="post">

                        <div th:if="${purchaseRequestDto.tourId != null}" class="mb-3">
                            <label class="form-label">Selected Tour</label>
                            <input type="text" class="form-control" th:value="${#lists.find(tours, t -> t.id == purchaseRequestDto.tourId)?.name}" readonly>
                            <!-- Hidden tourId field -->
                            <input type="hidden" th:field="*{tourId}"/>
                        </div>

                        <div th:if="${purchaseRequestDto.tourId == null}" class="mb-3">
                            <label for="tourId" class="form-label">Select Tour</label>
                            <select id="tourId" th:field="*{tourId}" class="form-select">
                                <option value="">-- Select a Tour --</option>
                                <option th:each="tour : ${tours}"
                                        th:value="${tour.id}"
                                        th:selected="${tour.id} == ${purchaseRequestDto.tourId}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="numOfAdults" class="form-label">Number of Adults</label>
                            <input type="number" id="numOfAdults" th:field="*{numOfAdults}" class="form-control" min="0" required/>
                        </div>

                        <div class="mb-3">
                            <label for="numOfChildren" class="form-label">Number of Children</label>
                            <input type="number" id="numOfChildren" th:field="*{numOfChildren}" class="form-control" min="0" required/>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-success">Submit Purchase</button>
                        </div>
                    </form>
                </div>

                <div class="card-footer text-center">
                    <a href="/purchases" class="btn btn-link">← Back to Purchase List</a>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
