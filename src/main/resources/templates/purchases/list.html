<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Purchase List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<h1>Recent Purchases</h1>

<a href="/purchases/new">+ New Purchase</a>
<br/><br/>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Tour Departure Date</th>
        <th>Adults</th>
        <th>Children</th>
        <th>Total Amount</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="purchase : ${purchases}">
        <td th:text="${purchase.id}">-</td>
        <td th:text="${purchase.tourDepartureDate}">YYYY-MM-DD</td>
        <td th:text="${purchase.numOfAdults}">-</td>
        <td th:text="${purchase.numOfChildren}">-</td>
        <td th:text="${purchase.totalAmount}">0.0</td>
        <td>
            <a th:href="@{'/purchases/' + ${purchase.id} + '/edit'}">Edit</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
