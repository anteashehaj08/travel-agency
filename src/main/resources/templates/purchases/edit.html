<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Purchase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<h1>Edit Purchase</h1>

<form th:action="@{'/purchases/update/' + ${purchaseRequestDto.id}}"
      th:object="${purchaseRequestDto}" method="post">

    <label for="tourId">Select Tour:</label>
    <select id="tourId" th:field="*{tourId}">
        <option th:each="tour : ${tours}"
                th:value="${tour.id}"
                th:selected="${tour.id} == ${purchaseRequestDto.tourId}">
        </option>
    </select>
    <br/><br/>

    <label for="numOfAdults">Number of Adults:</label>
    <input type="number" id="numOfAdults" th:field="*{numOfAdults}" min="0"/>
    <br/><br/>

    <label for="numOfChildren">Number of Children:</label>
    <input type="number" id="numOfChildren" th:field="*{numOfChildren}" min="0"/>
    <br/><br/>

    <button type="submit">Update</button>
</form>

<a href="/purchases">← Back to list</a>
</body>
</html>
