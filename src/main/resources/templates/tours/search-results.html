<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search Results</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-5">

<h2 th:text="'Search Results for ' + ${searchParam}"></h2>

<div th:if="${tours.isEmpty()}">
    <p>No tours found.</p>
</div>

<div class="row row-cols-1 row-cols-md-4 g-4" th:if="${!tours.isEmpty()}">
    <div class="col" th:each="t : ${tours}">
        <div class="card h-100">
            <div class="card-body">
                <p><strong>City:</strong> <span th:text="${t.toCityId})}"></span></p>
                <p><strong>Hotel:</strong> <span th:text="${t.toHotelId}"></span></p>
                <p><strong>Departure:</strong> <span th:text="${t.departureDate}"></span></p>
                <a th:href="@{/tours/details/{id}(id=${t.id})}" class="btn btn-outline-info">View Details</a>
            </div>
        </div>
    </div>
</div>

<a th:href="@{/tours/search}" class="btn btn-secondary mt-4">Back to Search</a>

</body>
</html>
