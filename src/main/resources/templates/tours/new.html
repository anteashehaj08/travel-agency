<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Tour</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-5">

<h2>Create a Tour</h2>

<form th:action="@{/tours/save}" th:object="${tour}" method="post">

    <div class="mb-3">
        <label for="departureDate" class="form-label">Departure Date</label>
        <input type="date" class="form-control" id="departureDate" th:field="*{departureDate}" required>
    </div>

    <div class="mb-3">
        <label for="fromCityId" class="form-label">From City ID</label>
        <input type="number" class="form-control" id="fromCityId" th:field="*{fromCityId}" required>
    </div>

    <div class="mb-3">
        <label for="toCityId" class="form-label">To City ID</label>
        <input type="number" class="form-control" id="toCityId" th:field="*{toCityId}" required>
    </div>

    <div class="mb-3">
        <label for="toHotelId" class="form-label">To Hotel ID</label>
        <input type="number" class="form-control" id="toHotelId" th:field="*{toHotelId}" required>
    </div>

    <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="promoted" th:field="*{promoted}">
        <label class="form-check-label" for="promoted">Promoted</label>
    </div>

    <button type="submit" class="btn btn-success">Create Tour</button>
    <a th:href="@{/tours}" class="btn btn-secondary">Cancel</a>

</form>

</body>
</html>
