<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Explore Tours</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">

<div class="d-flex justify-content-between align-items-center mb-4">
    <form class="d-flex w-50" th:action="@{/tours/search}" method="post">
        <label for="searchParam" class="visually-hidden">Search tours</label>
        <input class="form-control me-2" id="searchParam" type="text" name="searchParam" placeholder="Search by location...">
        <button class="btn btn-outline-primary" type="submit">Search</button>
    </form>

    <form class="d-flex gap-2" th:action="@{/tours/filter}" method="get">
        <div>
            <label for="sort" class="form-label">Sort by</label>
            <select class="form-select" name="sort" id="sort">
                <option value="promoted">Promoted</option>
                <option value="departure">Departure Date</option>
            </select>
        </div>
        <div>
            <label for="continent" class="form-label">Continent</label>
            <select class="form-select" name="continent" id="continent">
                <option value="">All</option>
                <option value="Europe">Europe</option>
                <option value="Asia">Asia</option>
                <!-- Add others -->
            </select>
        </div>
        <button class="btn btn-primary align-self-end" type="submit">Apply</button>
    </form>
</div>

<div class="row row-cols-1 row-cols-md-4 g-4">
    <div class="col" th:each="tour : ${tours}">
        <div class="card h-100">
            <div class="card-body">
                <h5 class="card-title" th:text="${tour.name}">Tour Name</h5>
                <p class="card-text">
                    <span th:text="'City: ' + ${tour.city}">City</span><br>
                    <span th:text="'Hotel: ' + ${tour.hotel}">Hotel</span><br>
                    <span th:text="'Departure: ' + ${tour.departureDate}">Departure</span>
                </p>
                <p class="text-success fw-bold" th:if="${tour.promoted}">Promoted</p>
                <a th:href="@{/tours/details/{id}(id=${tour.id})}" class="btn btn-outline-info">View Details</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
