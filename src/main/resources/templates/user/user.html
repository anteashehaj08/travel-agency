<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>User Form</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<h1>User Form</h1>

<h2>Create User</h2>
<form th:action="@{/user/create}" th:object="${user}" method="post">
  <div>
    <label for="username">Username:</label>
    <input type="text" id="username" th:field="*{user.username}" required />
  </div>
  <div>
    <label for="password">Password:</label>
    <input type="password" id="password" th:field="*{user.password}" required />
  </div>
  <div>
    <button type="submit">Create</button>
  </div>
</form>
<h2>Register User</h2>
<form th:action="@{/user/register}" th:object="${user}" method="post">
  <div>
    <label for="username2">Username:</label>
    <input type="text" id="username2" th:field="*{username}" required />
  </div>
  <div>
    <label for="password2">Password:</label>
    <input type="password" id="password2" th:field="*{password}" required />
  </div>
  <div>
    <button type="submit">Register</button>
  </div>
</form>
</body>
</html>
